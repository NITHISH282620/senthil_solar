# Supabase local/CI configuration.
#
# This file exists because the project previously had none, so `supabase start`
# ran on defaults — which include `enable_signup = true`. Against the running
# stack that was demonstrably exploitable:
#
#   POST /auth/v1/signup  ->  HTTP 200 with a usable access_token
#
# The database refuses unprovisioned accounts as well (migration 0010), so this
# is defence in depth rather than the only control. Both are needed: the trigger
# survives a dashboard change, and this file keeps every local and CI stack
# matching production instead of being quietly more permissive.

project_id = "senthil-solar"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000", "http://localhost:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

# THE SECURITY INVARIANT.
# Employees are created by the owner through the admin API in
# createEmployee(); nothing in the product depends on public registration.
# Leaving this true let anyone on the internet obtain an authenticated session.
enable_signup = false

# Password reset and invites still need to send mail, so the mailer stays on;
# only self-service signup is closed.
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = false
# 8 is the Supabase default and too short for an account that can move money.
# Matches loginSchema in src/lib/validations.ts.
minimum_password_length = 8

[auth.sms]
enable_signup = false
enable_confirmations = false

[storage]
enabled = true
file_size_limit = "50MiB"
